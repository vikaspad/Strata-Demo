# The element file the tests read their XPaths from, and the file the Strata plugin writes healed XPaths back into.
# Use the source path (not target/), relative to the project root. -Delements.file=... overrides it.
# A .properties element file works too: Page.element=xpath, plus Page.element.strata=Module.element.
elements.file=src/test/resources/UIElements/WebElements.xml
